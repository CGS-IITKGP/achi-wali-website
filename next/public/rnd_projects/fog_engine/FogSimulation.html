<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fog Engine Simulation</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #09090b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #ffffff;
    }

    #canvas-container {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas.emscripten {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      border: 0 none;
      background-color: #000000;
      outline: none;
      display: block;
      cursor: crosshair;
    }

    /* Top Right Action Bar */
    .top-bar {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 15, 20, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(236, 72, 153, 0.35);
      border-radius: 9999px;
      padding: 5px 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 15px rgba(236, 72, 153, 0.2);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .top-bar:hover {
      border-color: rgba(236, 72, 153, 0.6);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 0 25px rgba(236, 72, 153, 0.35);
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: #f472b6;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: all 0.2s ease;
      outline: none;
    }

    .btn-icon:hover {
      background: rgba(236, 72, 153, 0.25);
      border-color: rgba(236, 72, 153, 0.6);
      color: #ffffff;
      transform: scale(1.1);
      box-shadow: 0 0 12px rgba(236, 72, 153, 0.5);
    }

    .btn-icon:active {
      transform: scale(0.95);
    }

    .btn-icon svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Help Modal */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 16px;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 100%;
      max-width: 440px;
      background: linear-gradient(135deg, rgba(24, 24, 30, 0.95), rgba(12, 12, 16, 0.98));
      border: 1px solid rgba(236, 72, 153, 0.4);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(236, 72, 153, 0.2);
      transform: scale(0.95) translateY(10px);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-backdrop.active .modal-card {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-title span {
      background: linear-gradient(135deg, #ec4899, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .close-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: #9ca3af;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .close-btn:hover {
      background: rgba(236, 72, 153, 0.2);
      color: #ffffff;
      border-color: rgba(236, 72, 153, 0.5);
    }

    .controls-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 13px;
    }

    .control-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .control-keys {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    kbd {
      background: rgba(236, 72, 153, 0.15);
      border: 1px solid rgba(236, 72, 153, 0.4);
      color: #f472b6;
      font-weight: 600;
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 6px;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.5);
      font-family: inherit;
    }

    .control-desc {
      color: #d1d5db;
      font-weight: 500;
    }

    /* Loading Overlay */
    #loading-overlay {
      position: absolute;
      inset: 0;
      z-index: 40;
      background: radial-gradient(circle at center, #18181b 0%, #09090b 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner-ring {
      width: 54px;
      height: 54px;
      border: 3px solid rgba(236, 72, 153, 0.15);
      border-top-color: #ec4899;
      border-right-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      box-shadow: 0 0 25px rgba(236, 72, 153, 0.3);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #f3f4f6;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .progress-bar-container {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 30%;
      background: linear-gradient(90deg, #ec4899, #a855f7);
      border-radius: 9999px;
      transition: width 0.2s ease;
      animation: pulseWidth 1.5s ease-in-out infinite alternate;
    }

    @keyframes pulseWidth {
      0% { width: 20%; transform: translateX(0%); }
      100% { width: 80%; transform: translateX(25%); }
    }

    /* Hint banner on startup */
    .hint-toast {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(15, 15, 20, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(236, 72, 153, 0.3);
      border-radius: 9999px;
      padding: 8px 18px;
      font-size: 12px;
      color: #e5e7eb;
      pointer-events: none;
      opacity: 0.85;
      transition: opacity 0.4s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <div id="canvas-container">

    <!-- Top Right Bar with Help & Fullscreen -->
    <div class="top-bar">
      <!-- Help Button -->
      <button class="btn-icon" id="btn-help" title="Controls & Help" aria-label="Controls & Help">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </button>

      <!-- Fullscreen Button -->
      <button class="btn-icon" id="btn-fullscreen" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
        <svg id="icon-maximize" viewBox="0 0 24 24">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
        <svg id="icon-minimize" viewBox="0 0 24 24" style="display: none;">
          <path d="M4 14h6m0 0v6m0-6L3 21m17-7h-6m0 0v6m0-6l7 7M14 4v6m0 0h6m-6 0l7-7M4 10h6m0 0V4m0 6L3 3"></path>
        </svg>
      </button>
    </div>

    <!-- WebGL Canvas -->
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="1"></canvas>

    <!-- Initial Interactive Hint -->
    <div class="hint-toast" id="hint-toast">
      <span>🖱️ Click canvas to look around • Press <kbd>ESC</kbd> to unlock mouse</span>
    </div>

    <!-- Loading Screen -->
    <div id="loading-overlay">
      <div class="spinner-ring"></div>
      <div class="loading-text" id="status-text">Loading Fog Engine...</div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </div>

    <!-- Controls & Help Modal -->
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal-card">
        <div class="modal-header">
          <div class="modal-title">
            <span>Fog Engine</span> Controls
          </div>
          <button class="close-btn" id="modal-close" aria-label="Close">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="controls-list">
          <div class="control-item">
            <span class="control-desc">Move Camera</span>
            <div class="control-keys">
              <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
            </div>
          </div>
          <div class="control-item">
            <span class="control-desc">Look Around (Pitch / Yaw)</span>
            <div class="control-keys">
              <kbd>Mouse Move</kbd>
            </div>
          </div>
          <div class="control-item">
            <span class="control-desc">Lock / Engage Mouse</span>
            <div class="control-keys">
              <kbd>Click Canvas</kbd>
            </div>
          </div>
          <div class="control-item">
            <span class="control-desc">Release Mouse Cursor</span>
            <div class="control-keys">
              <kbd>ESC</kbd>
            </div>
          </div>
          <div class="control-item">
            <span class="control-desc">Cycle Camera Presets</span>
            <div class="control-keys">
              <kbd>C</kbd>
            </div>
          </div>
          <div class="control-item">
            <span class="control-desc">Fog Parameters & UI</span>
            <div class="control-keys">
              <kbd>On-Screen ImGui</kbd>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script type="text/javascript">
    const canvasElement = document.getElementById('canvas');
    const loadingOverlay = document.getElementById('loading-overlay');
    const statusText = document.getElementById('status-text');
    const progressBar = document.getElementById('progress-bar');
    const btnFullscreen = document.getElementById('btn-fullscreen');
    const iconMaximize = document.getElementById('icon-maximize');
    const iconMinimize = document.getElementById('icon-minimize');
    const btnHelp = document.getElementById('btn-help');
    const modalBackdrop = document.getElementById('modal-backdrop');
    const modalClose = document.getElementById('modal-close');
    const hintToast = document.getElementById('hint-toast');

    let isSimulationReady = false;

    function hideLoader() {
      if (!isSimulationReady) {
        isSimulationReady = true;
        loadingOverlay.classList.add('hidden');
        canvasElement.focus();
        setTimeout(() => {
          if (hintToast) {
            hintToast.style.opacity = '0';
            setTimeout(() => hintToast.remove(), 500);
          }
        }, 6000);
      }
    }

    function updateStatus(text) {
      if (!text) {
        hideLoader();
        return;
      }
      if (statusText) {
        statusText.textContent = text;
      }
      const match = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      if (match && progressBar) {
        const percent = (parseFloat(match[2]) / parseFloat(match[4])) * 100;
        progressBar.style.animation = 'none';
        progressBar.style.width = percent + '%';
      }
    }

    // Modal Events
    btnHelp.addEventListener('click', (e) => {
      e.stopPropagation();
      modalBackdrop.classList.add('active');
    });

    modalClose.addEventListener('click', (e) => {
      e.stopPropagation();
      modalBackdrop.classList.remove('active');
      canvasElement.focus();
    });

    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) {
        modalBackdrop.classList.remove('active');
        canvasElement.focus();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modalBackdrop.classList.contains('active')) {
        modalBackdrop.classList.remove('active');
        canvasElement.focus();
      }
    });

    // Fullscreen Toggle
    function isFullscreenActive() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }

    function updateFullscreenIcons() {
      if (isFullscreenActive()) {
        iconMaximize.style.display = 'none';
        iconMinimize.style.display = 'block';
      } else {
        iconMaximize.style.display = 'block';
        iconMinimize.style.display = 'none';
      }
    }

    function toggleFullscreenMode() {
      if (!isFullscreenActive()) {
        const target = document.documentElement;
        if (target.requestFullscreen) {
          target.requestFullscreen().catch(err => console.warn(err));
        } else if (target.webkitRequestFullscreen) {
          target.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(err => console.warn(err));
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    btnFullscreen.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFullscreenMode();
    });

    document.addEventListener('fullscreenchange', updateFullscreenIcons);
    document.addEventListener('webkitfullscreenchange', updateFullscreenIcons);

    // Canvas Focus Handling
    canvasElement.addEventListener('click', () => {
      canvasElement.focus();
    });

    canvasElement.addEventListener('webglcontextlost', (e) => {
      alert('WebGL context lost. Please reload the page.');
      e.preventDefault();
    }, false);

    // Emscripten Module Definition
    var Module = {
      canvas: canvasElement,
      locateFile: function(path, prefix) {
        if (path.endsWith('.wasm')) {
          return new URL('FogSimulation.wasm', window.location.href).href;
        }
        return (prefix || '') + path;
      },
      setStatus: function(text) {
        updateStatus(text);
      },
      onRuntimeInitialized: function() {
        console.log('Fog Engine runtime initialized successfully.');
        hideLoader();
      },
      postRun: [function() {
        console.log('Fog Engine postRun completed.');
        hideLoader();
      }],
      print: function(...args) {
        console.log('[FogEngine]', ...args);
      },
      printErr: function(...args) {
        console.error('[FogEngine Error]', ...args);
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        if (left === 0) {
          hideLoader();
        } else {
          updateStatus('Preparing (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')...');
        }
      }
    };

    window.onerror = function(event) {
      console.error('Simulation error:', event);
      if (statusText) {
        statusText.textContent = 'Error loading simulation.';
      }
    };

    window.addEventListener('unhandledrejection', function(event) {
      console.error('Unhandled rejection in simulation:', event.reason);
    });

    // Fallback timer: if WASM loaded and rendering starts without explicitly clearing status
    setTimeout(() => {
      if (!isSimulationReady && typeof GL !== 'undefined' && GL.contexts && GL.contexts.length > 0) {
        hideLoader();
      }
    }, 2500);
  </script>

  <!-- Load Simulation JS -->
  <script async type="text/javascript" src="FogSimulation.js"></script>

</body>
</html>
